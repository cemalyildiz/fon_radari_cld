name: Fon Radari - Gunluk Veri Kontrolu

on:
  schedule:
    # Her gun 05:10 UTC (Turkiye saatiyle 08:10)
    - cron: "10 5 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "data/calls.json"
      - "scripts/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: fon-radari-veri
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu cek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Kural ihlali varsa raporlama yine yapilsin, is akisi en sonda kirmizi olsun.
      - name: Kayitlari dogrulama kurallarindan gecir (DOGRULAMA.md)
        id: dogrulama
        continue-on-error: true
        run: python scripts/update_data.py

      - name: Yeni cagrilari tara
        continue-on-error: true
        run: python scripts/discover_calls.py

      - name: Acik kayitlarin resmi kaynak sayfalarini izle
        continue-on-error: true
        run: python scripts/check_sources.py

      - name: Dogrulama raporunu hazirla
        run: |
          [ -f data/rapor_anahtarlar.txt ] && cp data/rapor_anahtarlar.txt /tmp/onceki.txt || : > /tmp/onceki.txt
          python scripts/rapor.py /tmp/rapor.md data/rapor_anahtarlar.txt
          # Onceki raporda olmayan maddeler -> bildirim gerekir
          grep -vxF -f /tmp/onceki.txt data/rapor_anahtarlar.txt | sed '/^$/d' > /tmp/yeni.txt || true
          echo "Yeni madde sayisi: $(wc -l < /tmp/yeni.txt)"

      - name: Degisiklik varsa commit ve push yap
        run: |
          git config user.name "fon-radari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json data/rapor_anahtarlar.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: gunluk veri kontrolu, cagri taramasi ve kaynak izleme [otomatik]"
            git pull --rebase --autostash -q origin main
            git push
          else
            echo "Degisiklik yok."
          fi

      # Her gun YENI bir issue acmak yerine tek bir rapor issue'su guncellenir;
      # yalnizca yeni madde ciktiginda yorum eklenir (bildirim o zaman gelir).
      - name: Dogrulama raporu issue'sunu guncelle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create dogrulama-raporu --repo "$REPO" --color FBCA04 \
            --description "Fon Radari gunluk dogrulama raporu" --force >/dev/null 2>&1 || true
          NO=$(gh issue list --repo "$REPO" --label dogrulama-raporu --state open --json number --jq '.[0].number // empty')
          if [ -z "$NO" ]; then
            gh issue create --repo "$REPO" --label dogrulama-raporu \
              --title "Fon Radarı — doğrulama raporu" --body-file /tmp/rapor.md
          else
            gh issue edit "$NO" --repo "$REPO" --body-file /tmp/rapor.md
            if [ -s /tmp/yeni.txt ]; then
              {
                echo "Rapora **$(wc -l < /tmp/yeni.txt)** yeni madde eklendi ($(date -u +%Y-%m-%d)):"
                echo
                sed -e 's/^izleme:\([^:]*\):.*/- Kaynak sayfası değişti: `\1`/' \
                    -e 's/^dogrulama:\([^:]*\):.*/- Teyit uyarısı: `\1`/' \
                    -e 's/^kesif:\(.*\)/- Yeni sayfa: \1/' /tmp/yeni.txt | head -40
              } > /tmp/yorum.md
              gh issue comment "$NO" --repo "$REPO" --body-file /tmp/yorum.md
            fi
          fi

      - name: Kural ihlali varsa is akisini basarisiz say
        if: steps.dogrulama.outcome == 'failure'
        run: |
          echo "::error::data/calls.json dogrulama kurallarindan gecemedi. Ayrinti 'Kayitlari dogrulama kurallarindan gecir' adiminda. Bkz. DOGRULAMA.md"
          exit 1

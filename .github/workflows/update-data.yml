name: Fon Radarı - Saatlik Veri Kontrolü

on:
  schedule:
    - cron: "0 * * * *"   # her saat başı
  workflow_dispatch: {}     # elle tetikleme imkanı

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veri kontrol betiğini çalıştır
        run: python scripts/update_data.py

      - name: Değişiklik varsa commit ve push yap
        run: |
          git config user.name "fon-radari-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/calls.json; then
            git add data/calls.json
            git commit -m "chore: saatlik veri kontrolü [otomatik]"
            git push
          else
            echo "Değişiklik yok."
          fi
